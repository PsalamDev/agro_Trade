    <path d="M-40 -20 C-20 -45 10 -50 30 -40" stroke="#a9cfe0" stroke-width="8" fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M60 -20 C80 -35 110 -36 130 -26" stroke="#a9cfe0" stroke-width="7" fill="none" stroke-linecap="round" opacity="0.5"/>
  </g>
  <!-- fish 2 -->
