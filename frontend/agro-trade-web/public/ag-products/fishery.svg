  </defs>
  <rect width="800" height="520" fill="url(#bg)"/>
  <path d="M0 470 C200 430 300 450 400 455 C560 462 700 440 800 460 L800 520 L0 520 Z" fill="#b6d8e4" opacity="0.7"/>
  <!-- fish 1 -->
  <g transform="translate(330 250)">
