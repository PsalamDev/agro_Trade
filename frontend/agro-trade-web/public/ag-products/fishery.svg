  <!-- ice blocks -->
  <rect x="150" y="380" width="60" height="44" rx="8" fill="#dceef4" stroke="#bfe0ec" stroke-width="3" transform="rotate(-8 180 402)"/>
  <rect x="240" y="396" width="50" height="36" rx="8" fill="#dceef4" stroke="#bfe0ec" stroke-width="3" transform="rotate(6 265 414)"/>
  <text x="400" y="500" text-anchor="middle" font-family="system-ui, Arial, sans-serif" font-size="30" font-weight="700" fill="#2c5f7d" letter-spacing="4">FISHERY</text>
