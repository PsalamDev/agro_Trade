name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  backend:
    name: Backend build & test
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: true
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Start SQL Server
        run: |
          docker run -d \
            --name agrotrade-sql \
            -e "ACCEPT_EULA=Y" \
            -e "MSSQL_SA_PASSWORD=AgroTrade!Test123" \
            -p 1433:1433 \
            mcr.microsoft.com/mssql/server:2022-latest
        # Give SQL Server a moment to become ready (health probe loop below).

      - name: Wait for SQL Server
        run: |
          for i in $(seq 1 30); do
            if /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "AgroTrade!Test123" -C -Q "SELECT 1" >/dev/null 2>&1; then
              echo "SQL Server is ready"; exit 0
            fi
            sleep 2
          done
          echo "SQL Server did not become ready" && exit 1

      - name: Restore
        run: dotnet restore AgroTrade.slnx

      - name: Build
        run: dotnet build AgroTrade.slnx --no-restore -warnaserror

      - name: Test (integration tests use the SQL Server container)
        env:
          AGROTRADE_TEST_CONNECTION: "Server=localhost,1433;Database=AgroTrade_Tests;User Id=sa;Password=AgroTrade!Test123;TrustServerCertificate=True;"
        run: dotnet test AgroTrade.slnx --no-build

  frontend:
    name: Frontend build & lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/agro-trade-web
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/agro-trade-web/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build